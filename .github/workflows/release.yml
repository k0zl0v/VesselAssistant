name: Release

# Trigger on tag push (v0.1.0, v0.1.1, ...) and on manual run from the
# Actions UI. Tag-pushed runs publish a draft GitHub Release with all
# built bundles attached. Manual runs build but do NOT publish.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14            # Apple Silicon
            label: macOS arm64
            rust-target: aarch64-apple-darwin
            tauri-args: '--target aarch64-apple-darwin'
          - platform: windows-latest      # x86_64
            label: Windows x64
            rust-target: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit / integration tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag-only: when pushed via tag, attach artifacts to a draft Release.
          # workflow_dispatch leaves these blank so artifacts only land in
          # the workflow run's "Artifacts" section.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VesselAssistant {0}', github.ref_name) || '' }}
          releaseBody: |
            Automated release built from ${{ github.sha }}.

            **macOS arm64 (Apple Silicon):**
            Download `.dmg`, open it, drag VesselAssistant to Applications.
            First launch: right-click the app → Open → confirm
            (binaries are unsigned).

            **Windows x64:**
            Download the `.msi` (Windows Installer) or the `.exe`
            (NSIS — supports per-user install without admin).
            SmartScreen warning is expected on first run (unsigned).
            On Windows 10 the installer will fetch WebView2 if missing;
            Windows 11 already has it.

            ---
            See README.md for the FR coverage matrix.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}
