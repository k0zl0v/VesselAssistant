name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capabilities_ref:
        description: >
          Commit SHA (full or abbreviated), tag, or branch name of origin to check out
          src-tauri/capabilities/default.json from before the windows-smoke build
          (hypothesis 10: measure write_text_file/read_text_file against a prior
          commit's capabilities instead of the branch's own).
        required: false
        default: ''

env:
  # release.yml also targets 22; keep both on the same major so a green CI actually
  # predicts a green release build.
  NODE_VERSION: 22

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      # workflow_dispatch runs rust/windows-smoke unconditionally; skipping the filter there
      # keeps it from failing on a payload with no base commit (dorny/paths-filter#100) and
      # thereby skipping both dependents via the implicit success().
      # predicate-quantifier below must be 'every': the default 'some' matches a file if
      # ANY pattern does, so '**' alone always wins and the '!' lines never exclude it.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            rust:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.vscode/**'
              - '!.gitignore'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Own folder, not test-results/: Playwright wipes its outputDir (default
      # "test-results") at the start of every run and would delete this report first.
      - run: mkdir -p reports
      - run: npm run test:unit -- --reporter=json --outputFile=reports/unit.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - run: node scripts/assert-no-skips.mjs reports/unit.json test-results/e2e.json

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webkit2gtk (Tauri build-time dependency, even for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      # cargo test does not need dist/ (measured at У4 step 22: renaming dist/ away left
      # 11/11 Rust tests green) — no npm/build step before it.
      - run: mkdir -p test-results
      - name: Run cargo test (pipefail so a failing test fails this step, not just tee)
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee test-results/rust.log
      - run: node scripts/assert-no-skips.mjs test-results/rust.log

  windows-smoke:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    # windows-2025 ships WebView2 152+, which never opens the DevTools port when msedgedriver
    # launches the app, so tauri-driver cannot create a session (actions/runner-images#14738).
    runs-on: windows-2022
    steps:
      # Full history + tags: `git fetch --depth=1 origin <sha>` rejects an abbreviated
      # SHA ("couldn't find remote ref"), so capabilities_ref is resolved locally instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out capabilities from capabilities_ref (hypothesis 10 measurement)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capabilities_ref != '' }}
        shell: bash
        env:
          CAPABILITIES_REF: ${{ inputs.capabilities_ref }}
        run: |
          if git rev-parse --verify --quiet "${CAPABILITIES_REF}^{commit}" >/dev/null; then
            ref="$CAPABILITIES_REF"
          elif git rev-parse --verify --quiet "origin/${CAPABILITIES_REF}^{commit}" >/dev/null; then
            ref="origin/$CAPABILITIES_REF"
          else
            echo "::error::capabilities_ref '$CAPABILITIES_REF' is not a commit, tag or branch of origin"
            exit 1
          fi
          git checkout "$ref" -- src-tauri/capabilities/default.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: cargo install tauri-driver --locked
      # msedgedriver-tool is not on crates.io; it downloads the msedgedriver.exe matching the
      # runner's WebView2 into the working directory, which tauri-driver then finds via PATH.
      - name: Install msedgedriver matching the runner's WebView2
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Push-Location $dir
          msedgedriver-tool
          Pop-Location
          if (-not (Test-Path (Join-Path $dir 'msedgedriver.exe'))) { throw 'msedgedriver.exe was not downloaded' }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm run tauri build -- --debug --no-bundle
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:smoke
